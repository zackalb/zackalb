<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blood Type Inheritance Game</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    color: #333;
  }
  .container {
    background-color: #ffffff;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    padding: 30px;
    max-width: 600px;
    width: 100%;
    text-align: center;
    border: 1px solid #e0e0e0;
  }
  h1 {
    color: #2c3e50;
    margin-bottom: 25px;
    font-size: 2.2em;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 30px;
  }
  .input-item {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
  }
  label {
    font-weight: 600;
    margin-bottom: 8px;
    color: #555;
    font-size: 1.1em;
  }
  select {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 1em;
    background-color: #f9f9f9;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http://www.w3.org/2000/svg%22%20viewBox%3D%220%200%2020%2020%22%3E%3Cpath%20d%3D%22M5%206l5%205%205-5z%22%20fill%3D%22666%22/%3E%3C/svg%3E');
    background-repeat: no-repeat;
    background-position: right 15px center;
    background-size: 12px;
    cursor: pointer;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  select:focus {
    border-color: #6a82fb;
    box-shadow: 0 0 0 3px rgba(106, 130, 251, 0.2);
    outline: none;
  }
  button {
    background: linear-gradient(45deg, #6a82fb, #fc5c7d);
    color: white;
    padding: 14px 25px;
    border: none;
    border-radius: 8px;
    font-size: 1.1em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  button:hover {
    background: linear-gradient(45deg, #5c70e0, #e04b6b);
    box-shadow: 0 7px 20px rgba(0, 0, 0, 0.2);
    transform: translateY(-2px);
  }
  button:active {
    transform: translateY(0);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
  }
  .results {
    margin-top: 30px;
    padding-top: 25px;
    border-top: 1px solid #eee;
    text-align: left;
  }
  .results h2 {
    color: #2c3e50;
    font-size: 1.8em;
    margin-bottom: 15px;
    font-weight: 700;
  }
  .results ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .results li {
    background-color: #f8fafd;
    border: 1px solid #e6eaf0;
    padding: 12px 18px;
    margin-bottom: 10px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 1.1em;
    color: #444;
  }
  .results li strong {
    color: #34495e;
    font-weight: 700;
  }
  .results li span {
    color: #6a82fb;
    font-weight: 600;
  }
  .message-box {
    background-color: #fff3cd;
    border: 1px solid #ffeeba;
    color: #856404;
    padding: 15px;
    border-radius: 8px;
    margin-top: 20px;
    display: none; 
    font-size: 0.95em;
    text-align: left;
  }
  
  @media (min-width: 480px) {
    .input-group {
      flex-direction: row;
      justify-content: space-between;
    }
    .input-item {
      width: 48%; 
    }
  }
  @media (max-width: 480px) {
    .container {
      padding: 20px;
    }
    h1 {
      font-size: 1.8em;
    }
    button {
      width: 100%;
    }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Blood Type Inheritance</h1>
  <div class="input-group">
    <div class="input-item">
      <label for="motherBloodType">Mother's Blood Type:</label>
      <select id="motherBloodType">
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
      </select>
    </div>
    <div class="input-item">
      <label for="fatherBloodType">Father's Blood Type:</label>
      <select id="fatherBloodType">
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
      </select>
    </div>
  </div>
  <button id="simulateButton">Simulate Inheritance</button>
  <div class="message-box" id="messageBox"></div>
  <div class="results" id="results">
    <h2>Possible Children's Blood Types:</h2>
    <ul id="resultsList">
    </ul>
  </div>
</div>

<script>
const bloodTypeGenotypes = {
  'A+': { abo: ['AA', 'AO'], rh: ['DD', 'Dd'] },
  'A-': { abo: ['AA', 'AO'], rh: ['dd'] },
  'B+': { abo: ['BB', 'BO'], rh: ['DD', 'Dd'] },
  'B-': { abo: ['BB', 'BO'], rh: ['dd'] },
  'AB+': { abo: ['AB'], rh: ['DD', 'Dd'] },
  'AB-': { abo: ['AB'], rh: ['dd'] },
  'O+': { abo: ['OO'], rh: ['DD', 'Dd'] },
  'O-': { abo: ['OO'], rh: ['dd'] }
};

function getAllelePairs(genotype) {
  if (genotype.length === 2) {
    return [genotype[0], genotype[1]];
  }
  return [];
}

function calculateOffspringGenotypes(parent1Genotypes, parent2Genotypes) {
  const possibleOffspring = {};
  parent1Genotypes.forEach(p1G => {
    const p1Alleles = getAllelePairs(p1G);
    parent2Genotypes.forEach(p2G => {
      const p2Alleles = getAllelePairs(p2G);
      const combinations = [
        p1Alleles[0] + p2Alleles[0],
        p1Alleles[0] + p2Alleles[1],
        p1Alleles[1] + p2Alleles[0],
        p1Alleles[1] + p2Alleles[1]
      ];
      combinations.forEach(combo => {
        const sortedCombo = combo.split('').sort().join('');
        possibleOffspring[sortedCombo] = (possibleOffspring[sortedCombo] || 0) + 1;
      });
    });
  });

  const totalCombinations = Object.values(possibleOffspring).reduce((sum, count) => sum + count, 0);
  const probabilities = {};
  for (const genotype in possibleOffspring) {
    probabilities[genotype] = possibleOffspring[genotype] / totalCombinations;
  }
  return probabilities;
}

function getABOPhenotype(genotype) {
  if (genotype.includes('A') && genotype.includes('B')) return 'AB';
  if (genotype.includes('A')) return 'A';
  if (genotype.includes('B')) return 'B';
  if (genotype.includes('O')) return 'O';
  return 'Unknown';
}

function getRhPhenotype(genotype) {
  if (genotype.includes('D')) return '+';
  if (genotype.includes('d')) return '-';
  return 'Unknown';
}

function simulateInheritance() {
  const motherBloodType = document.getElementById('motherBloodType').value;
  const fatherBloodType = document.getElementById('fatherBloodType').value;
  const resultsList = document.getElementById('resultsList');
  const messageBox = document.getElementById('messageBox');

  resultsList.innerHTML = '';
  messageBox.style.display = 'none';

  const motherABOGenotypes = bloodTypeGenotypes[motherBloodType].abo;
  const motherRhGenotypes = bloodTypeGenotypes[motherBloodType].rh;
  const fatherABOGenotypes = bloodTypeGenotypes[fatherBloodType].abo;
  const fatherRhGenotypes = bloodTypeGenotypes[fatherBloodType].rh;

  const aboProbabilities = calculateOffspringGenotypes(motherABOGenotypes, fatherABOGenotypes);
  const rhProbabilities = calculateOffspringGenotypes(motherRhGenotypes, fatherRhGenotypes);

  const finalResults = {};

  for (const aboGenotype in aboProbabilities) {
    const aboPhenotype = getABOPhenotype(aboGenotype);
    for (const rhGenotype in rhProbabilities) {
      const rhPhenotype = getRhPhenotype(rhGenotype);
      const combinedBloodType = aboPhenotype + rhPhenotype;
      const combinedProbability = aboProbabilities[aboGenotype] * rhProbabilities[rhGenotype];
      finalResults[combinedBloodType] = (finalResults[combinedBloodType] || 0) + combinedProbability;
    }
  }

  if (Object.keys(finalResults).length === 0) {
    messageBox.textContent = "Could not determine possible blood types. Please check your input.";
    messageBox.style.display = 'block';
    return;
  }

  const sortedResults = Object.entries(finalResults).sort(([typeA], [typeB]) => typeA.localeCompare(typeB));
  sortedResults.forEach(([bloodType, probability]) => {
    const listItem = document.createElement('li');
    const percentage = (probability * 100).toFixed(2);
    listItem.innerHTML = `<strong>${bloodType}</strong> <span>${percentage}%</span>`;
    resultsList.appendChild(listItem);
  });
}

window.onload = function() {
  document.getElementById('simulateButton').addEventListener('click', simulateInheritance);
  simulateInheritance(); 
};
</script>
</body>
</html>
